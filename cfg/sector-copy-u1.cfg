# Mapa linkera jest celowo podzielona tak, aby cale $4000-$7FFF pozostalo
# oknem bankowanego bufora. Segmenty file="" nie trafiaja do XEX: loader nie
# musi zerowac prawie kilobajta stanu i bufora sektorowego, robi to program.
#
# $3600-$3FFF lezy ponizej okna bankow, a $8000+ powyzej niego. Kod moze wiec
# pracowac bez wzgledu na wartosc PORTB tylko wtedy, gdy buffer.s po kazdym
# dostepie przywroci pamiec glowna. Rozmiary sa sprawdzane przez
# tools/check_memory_map.py; przekroczenie granicy konczy `make test` bledem.
MEMORY {
    ZP:     file = "", start = $0080, size = $0080, type = rw, define = yes;
    AUXCODE:file = %O, start = $3600, size = $0200, type = ro, define = yes;
    STATE:  file = "", start = $3800, size = $012C, type = rw, define = yes;
    LOWCODE:file = %O, start = $392C, size = $0059, type = ro, define = yes;
    HSIO:   file = %O, start = $3985, size = $0385, type = ro, define = yes;
    UICODE: file = %O, start = $3D0A, size = $00F6, type = rw, define = yes;
    SCRATCH:file = "", start = $3E00, size = $0200, type = rw, define = yes;
    # Zachowujemy twarda granice $A000 dla zgodnosci z konfiguracjami, w
    # ktorych obszar BASIC/kartridza nie jest zwyklym RAM-em. Po ustawieniu
    # APPMHI nowy ekran E: powstaje wysoko (na typowej maszynie od $BC40).
    MAIN:   file = %O, start = $8000, size = $2000, type = rw, define = yes;
    RUNVEC: file = %O, start = $02E0, size = $0002, type = ro;
}

FILES {
    # format=atari tworzy segmentowy plik XEX z naglowkami $FFFF/start/end.
    %O: format = atari;
}

SEGMENTS {
    # RUNAD laduje dwa bajty pod $02E0 i wskazuje na etykiete start w main.s.
    ZEROPAGE: load = ZP,     type = zp;
    AUXCODE:  load = AUXCODE,type = ro;
    BSS:      load = STATE,  type = bss, define = yes;
    LOWCODE:  load = LOWCODE,type = ro;
    HSIO:     load = HSIO,   type = ro;
    UICODE:   load = UICODE, type = ro;
    SCRATCH:  load = SCRATCH,type = bss;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro, define = yes;
    DATA:     load = MAIN,   type = rw;
    RUNAD:    load = RUNVEC, type = ro;
}
