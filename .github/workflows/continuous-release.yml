name: Budowanie gotowego XEX

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN może wyłącznie odczytać kod i zaktualizować wydanie w tym
# repozytorium. Nie korzystamy z osobistego tokenu właściciela.
permissions:
  contents: write

concurrency:
  group: continuous-release
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Zbuduj, przetestuj i opublikuj
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz źródła
        uses: actions/checkout@v7

      - name: Zainstaluj zestaw cc65
        run: |
          sudo apt-get update
          sudo apt-get install --yes cc65

      - name: Zbuduj program i uruchom testy
        run: make clean test

      - name: Przygotuj pliki wydania
        run: |
          mkdir -p release
          cp build/sector-copy-u1.xex release/sector-copy-u1.xex
          sha256sum release/sector-copy-u1.xex | sed 's#release/##' > release/SHA256SUMS.txt

          VERSION_NUMBER="$(tr -d '[:space:]' < VERSION)"
          awk -v version="${VERSION_NUMBER}" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release/RELEASE_NOTES.md
          test -s release/RELEASE_NOTES.md
          printf '\nCommit: `%s`\n' "${GITHUB_SHA}" >> release/RELEASE_NOTES.md

      - name: Utwórz lub zaktualizuj wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NUMBER="$(tr -d '[:space:]' < VERSION)"
          VERSION_TAG="v${VERSION_NUMBER}"

          # Numerowane wydanie jest niezmienne. Powstaje tylko raz, po udanym
          # zbudowaniu pierwszego commitu deklarującego dany numer wersji.
          if ! gh release view "${VERSION_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${VERSION_TAG}" \
              release/sector-copy-u1.xex \
              release/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Sector Copy U1 ${VERSION_NUMBER}" \
              --notes-file release/RELEASE_NOTES.md \
              --latest
          fi

          # Stały adres pobierania wymaga stałego tagu, ale tag ma wskazywać
          # dokładnie commit, z którego pochodzi aktualnie publikowany XEX.
          git tag --force continuous "${GITHUB_SHA}"
          git push --force origin refs/tags/continuous

          if gh release view continuous --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit continuous \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Sector Copy U1 ${VERSION_NUMBER} — najnowsza wersja" \
              --notes-file release/RELEASE_NOTES.md \
              --latest=false
            gh release upload continuous \
              release/sector-copy-u1.xex \
              release/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create continuous \
              release/sector-copy-u1.xex \
              release/SHA256SUMS.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Sector Copy U1 ${VERSION_NUMBER} — najnowsza wersja" \
              --notes-file release/RELEASE_NOTES.md \
              --latest=false
          fi
